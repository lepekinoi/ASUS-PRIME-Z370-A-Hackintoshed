name: Update Hackintosh README

on:
  push:
    branches:
      - master
    paths:
      - "EFI/**"
      - "README.template.md"
      - "tools/render_readme.py"
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour pousser les modifications

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Versions et tableaux lus dans l'EFI du depot (config.plist, Info.plist des kexts)
      - name: Generate README from template
        run: python3 tools/render_readme.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Ne commit que s'il y a des changements
          git diff --staged --quiet || (git commit -m "docs: README regenere depuis l'EFI" && git push)
